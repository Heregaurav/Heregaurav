<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="55%" stop-color="#10122a"/>
      <stop offset="100%" stop-color="#221a33"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6ecd2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f6ecd2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2040"/>
      <stop offset="100%" stop-color="#171b36"/>
    </linearGradient>

    <linearGradient id="midHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12142c"/>
      <stop offset="100%" stop-color="#0e0f22"/>
    </linearGradient>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blurMist" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky)"/>

  <!-- stars, slow twinkle -->
  <g fill="#f6ecd2">
    <circle cx="80" cy="50" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="90" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="40" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="70" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="35" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="95" r="1" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="55" r="1.4" opacity="0.55"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="30" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="140" r="1" opacity="0.35"><animate attributeName="opacity" values="0.35;0.08;0.35" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="130" r="0.9" opacity="0.3"><animate attributeName="opacity" values="0.3;0.08;0.3" dur="6.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="60" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="6.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="110" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="7.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="980" cy="85" r="85" fill="url(#moonGlow)" filter="url(#blurSoft)"/>
  <circle cx="980" cy="85" r="34" fill="#f3ead1"/>
  <circle cx="992" cy="72" r="5" fill="#e6dcc0" opacity="0.5"/>
  <circle cx="970" cy="98" r="3.5" fill="#e6dcc0" opacity="0.4"/>
  <circle cx="988" cy="100" r="2.5" fill="#e6dcc0" opacity="0.4"/>

  <!-- far hills -->
  <path d="M0,260 Q120,230 240,250 T480,240 T720,255 T960,235 T1200,250 L1200,400 L0,400 Z" fill="url(#farHills)"/>

  <!-- mid hills with the Great Wall along the ridge -->
  <path d="M0,300 Q150,265 300,285 T600,270 T900,290 T1200,275 L1200,400 L0,400 Z" fill="url(#midHills)"/>

  <!-- wall line following the mid ridge, simple crenellations -->
  <g stroke="#2a2e4c" stroke-width="3" fill="none" opacity="0.8">
    <path d="M20,296 Q150,262 300,282 T600,267 T900,287 T1180,273"/>
  </g>
  <g fill="#20233d" opacity="0.85">
    <rect x="140" y="255" width="6" height="10"/>
    <rect x="160" y="253" width="6" height="10"/>
    <rect x="180" y="252" width="6" height="10"/>
    <rect x="380" y="256" width="6" height="10"/>
    <rect x="400" y="255" width="6" height="10"/>
    <rect x="420" y="255" width="6" height="10"/>
    <rect x="680" y="253" width="6" height="10"/>
    <rect x="700" y="252" width="6" height="10"/>
    <rect x="720" y="253" width="6" height="10"/>
  </g>
  <!-- watchtowers -->
  <g fill="#1c1f38">
    <path d="M255,283 L255,262 L266,255 L277,262 L277,283 Z"/>
    <path d="M545,270 L545,250 L556,243 L567,250 L567,270 Z"/>
    <path d="M845,272 L845,252 L856,245 L867,252 L867,272 Z"/>
  </g>

  <!-- drifting mist, very slow -->
  <g fill="#c9d4f0" opacity="0.06" filter="url(#blurMist)">
    <ellipse cx="300" cy="310" rx="260" ry="30">
      <animate attributeName="cx" values="300;420;300" dur="34s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="850" cy="300" rx="300" ry="26">
      <animate attributeName="cx" values="850;700;850" dur="40s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- foreground terrace -->
  <path d="M0,400 L0,340 Q300,320 600,332 T1200,325 L1200,400 Z" fill="#05060d"/>

  <!-- coder figure, simple silhouette, sitting cross-legged with a laptop -->
  <g fill="#03040a">
    <!-- body / shoulders wrapped like a light blanket -->
    <path d="M150,400 Q145,345 195,335 Q225,330 250,340 Q285,352 288,400 Z"/>
    <!-- head -->
    <circle cx="212" cy="318" r="20"/>
    <!-- small knot of hair -->
    <path d="M196,304 Q206,292 222,298 Q228,302 224,310 Q210,300 196,304 Z"/>
    <!-- crossed legs, low simple shape -->
    <path d="M160,400 Q170,378 220,378 Q270,378 282,400 Z"/>
    <!-- laptop, open, resting on lap -->
    <path d="M180,372 L246,372 L238,388 L188,388 Z" fill="#05070f"/>
    <rect x="186" y="356" width="56" height="18" rx="2" fill="#05070f"/>
  </g>
  <!-- laptop screen glow -->
  <rect x="189" y="359" width="50" height="12" rx="1" fill="#bfe3ff" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.4;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <ellipse cx="214" cy="365" rx="70" ry="45" fill="url(#lampGlow)" filter="url(#blurSoft)" opacity="0.5"/>

  <!-- tea cup with slow rising steam -->
  <g>
    <path d="M320,392 L352,392 L348,404 L324,404 Z" fill="#03040a"/>
    <ellipse cx="336" cy="392" rx="16" ry="3" fill="#0a0c18"/>
    <g stroke="#e8ecf5" stroke-width="1.6" fill="none" opacity="0.35" stroke-linecap="round">
      <path d="M330,388 Q326,376 332,368 Q338,360 333,350">
        <animate attributeName="opacity" values="0.35;0.05;0.35" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M342,388 Q346,378 340,368 Q334,358 340,348">
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
