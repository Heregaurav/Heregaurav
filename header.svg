<svg width="860" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Orbitron:wght@700;900');

      .bg { fill: #040b04; }
      .grid { fill: url(#gridPattern); }
      .border { fill: #00ff41; opacity: 0.03; }
      .border-line { fill: none; stroke: #00ff41; stroke-width: 1; opacity: 0.4; }
      
      .title {
        font-family: 'Orbitron', 'Courier New', monospace;
        font-size: 38px;
        font-weight: 900;
        fill: #00ff41;
        letter-spacing: 6px;
      }
      .sub {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #00cc33;
        letter-spacing: 3px;
      }
      .prompt-cyan {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 15px;
        fill: #00f5ff;
        font-weight: bold;
      }
      .prompt {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 15px;
        fill: #00ff41;
      }
      .dim {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #00aa33;
        letter-spacing: 0.5px;
      }
      .label {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 12px;
        fill: #00aa22;
        letter-spacing: 2px;
      }
      .status {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #00771a;
        letter-spacing: 1.5px;
      }
      .tag-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: bold;
      }
      .cursor-rect {
        fill: #00ff41;
        animation: blink 1s step-end infinite;
      }
      .glitch {
        animation: glitch 5s infinite;
      }
      .scan-line {
        animation: scan 3s linear infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glitch {
        0%, 88%, 100% { transform: none; }
        90% { transform: translateX(-2px); filter: drop-shadow(3px 0 #ff003c); }
        91% { transform: translateX(2px); filter: drop-shadow(-3px 0 #00f5ff); }
        92% { transform: none; }
      }
      @keyframes scan {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(750px); }
      }
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>

    <!-- Glowing Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid and Scanlines -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="650" class="bg"/>
  
  <!-- Tactical Grid -->
  <rect width="860" height="650" class="grid"/>
  
  <!-- CRT Scanline overlay -->
  <rect width="860" height="650" fill="url(#scanlines)"/>

  <!-- Main Terminal Box -->
  <rect x="12" y="12" width="836" height="626" class="border" rx="4"/>
  <rect x="12" y="12" width="836" height="626" class="border-line" rx="4"/>

  <!-- Cyberpunk Corner Accents -->
  <path d="M 12 40 L 12 12 L 40 12" fill="none" stroke="#00ff41" stroke-width="2" filter="url(#glow-sm)"/>
  <path d="M 848 40 L 848 12 L 820 12" fill="none" stroke="#00ff41" stroke-width="2" filter="url(#glow-sm)"/>
  <path d="M 12 610 L 12 638 L 40 638" fill="none" stroke="#00ff41" stroke-width="2" filter="url(#glow-sm)"/>
  <path d="M 848 610 L 848 638 L 820 638" fill="none" stroke="#00ff41" stroke-width="2" filter="url(#glow-sm)"/>

  <!-- Top Tab / Label -->
  <rect x="25" y="0" width="220" height="18" fill="#040b04" stroke="#00ff41" stroke-width="1" opacity="0.8"/>
  <text x="35" y="13" class="label" fill="#00ff41">[ README.md ] — DECRYPTED</text>

  <!-- Scanning line animation -->
  <rect x="0" y="0" width="860" height="2" fill="#00ff41" opacity="0.5" class="scan-line" filter="url(#glow)"/>

  <!-- macOS-style Terminal Dots but Cyber-themed -->
  <circle cx="35" cy="45" r="5" fill="#ff003c" class="pulse"/>
  <circle cx="55" cy="45" r="5" fill="#ffe135"/>
  <circle cx="75" cy="45" r="5" fill="#00ff41"/>
  <line x1="95" y1="45" x2="840" y2="45" stroke="#00ff41" stroke-width="1" opacity="0.2"/>
  <text x="105" y="49" class="label">root@localhost:/home/gaurav_kumar</text>

  <!-- ==================== HEADER SECTION ==================== -->
  <text x="430" y="130" class="title glitch" text-anchor="middle" filter="url(#glow)">GAURAV</text>
  <text x="430" y="165" class="sub" text-anchor="middle">BTECH IN ECE &amp; CYBERSECURITY MINOR @ IIIT DHARWAD </text>

  <line x1="30" y1="200" x2="830" y2="200" stroke="#00ff41" stroke-width="1" opacity="0.15"/>

  <!-- ==================== TERMINAL PROMPT ==================== -->
  <text x="40" y="245" class="prompt-cyan">root@gh:~$</text>
  <text x="125" y="245" class="prompt"> whoami</text>
  <rect x="195" y="232" width="10" height="16" class="cursor-rect"/>

  <!-- Output Lines -->
  <text x="40" y="285" class="dim">  &gt;  B.Tech student navigating the intersection of Security &amp; Development</text>
  <text x="40" y="315" class="dim">  &gt;  Passionate about Cybersecurity, Software Development, Networking and AI integrations</text>
  <text x="40" y="345" class="dim">  &gt;  Mission: Build futuristic, robust architecture. Break it to make it stronger.</text>

  <line x1="30" y1="390" x2="830" y2="390" stroke="#00ff41" stroke-width="1" opacity="0.15"/>

  <!-- ==================== ARSENAL SECTION ==================== -->
  <text x="40" y="425" class="label" fill="#00b7ff" filter="url(#glow-sm)">// ACTIVE ARSENAL</text>

  <!-- Row 1: Offensive Security (Red) -->
  <g transform="translate(40, 445)">
    <!-- Burp Suite -->
    <rect x="0" y="0" width="105" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="12" cy="12" r="3" fill="#ff003c" class="pulse"/>
    <text x="22" y="16" class="tag-text" fill="#ff6b6b">BURP SUITE</text>
    
    <!-- Nmap -->
    <rect x="115" y="0" width="70" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="127" cy="12" r="3" fill="#ff003c" class="pulse"/>
    <text x="137" y="16" class="tag-text" fill="#ff6b6b">NMAP</text>

    <!-- Wireshark -->
    <rect x="195" y="0" width="105" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="207" cy="12" r="3" fill="#ff003c" class="pulse"/>
    <text x="217" y="16" class="tag-text" fill="#ff6b6b">WIRESHARK</text>

    <!-- Metasploit -->
    <rect x="310" y="0" width="110" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="322" cy="12" r="3" fill="#ff003c" class="pulse"/>
    <text x="332" y="16" class="tag-text" fill="#ff6b6b">METASPLOIT</text>

    <!-- Linux -->
    <rect x="430" y="0" width="75" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="442" cy="12" r="3" fill="#ff003c" class="pulse"/>
    <text x="452" y="16" class="tag-text" fill="#ff6b6b">LINUX</text>
  </g>

  <!-- Row 2: Development / Languages (Green) -->
  <g transform="translate(40, 485)">
    <!-- C++ -->
    <rect x="0" y="0" width="55" height="24" fill="#00ff41" fill-opacity="0.08" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="12" cy="12" r="3" fill="#00ff41" class="pulse"/>
    <text x="22" y="16" class="tag-text" fill="#00ff41">C++</text>
    
    <!-- Python -->
    <rect x="65" y="0" width="80" height="24" fill="#00ff41" fill-opacity="0.08" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="77" cy="12" r="3" fill="#00ff41" class="pulse"/>
    <text x="87" y="16" class="tag-text" fill="#00ff41">PYTHON</text>

    <!-- React -->
    <rect x="155" y="0" width="75" height="24" fill="#00ff41" fill-opacity="0.08" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="167" cy="12" r="3" fill="#00ff41" class="pulse"/>
    <text x="177" y="16" class="tag-text" fill="#00ff41">REACT</text>

    <!-- SQL -->
    <rect x="240" y="0" width="60" height="24" fill="#00ff41" fill-opacity="0.08" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="252" cy="12" r="3" fill="#00ff41" class="pulse"/>
    <text x="262" y="16" class="tag-text" fill="#00ff41">SQL</text>

    <!-- Node.js -->
    <rect x="310" y="0" width="90" height="24" fill="#00ff41" fill-opacity="0.08" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="322" cy="12" r="3" fill="#00ff41" class="pulse"/>
    <text x="332" y="16" class="tag-text" fill="#00ff41">NODE.JS</text>
    
    <!-- Redis -->
    <rect x="410" y="0" width="75" height="24" fill="#00ff41" fill-opacity="0.08" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="422" cy="12" r="3" fill="#00ff41" class="pulse"/>
    <text x="432" y="16" class="tag-text" fill="#00ff41">REDIS</text>
  </g>

  <!-- Row 3: Compute / Hardware / AI (Cyan) -->
  <g transform="translate(40, 525)">
    <!-- Docker -->
    <rect x="0" y="0" width="85" height="24" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="12" cy="12" r="3" fill="#00f5ff" class="pulse"/>
    <text x="22" y="16" class="tag-text" fill="#00f5ff">DOCKER</text>

    <!-- Kubernetes -->
    <rect x="95" y="0" width="115" height="24" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="107" cy="12" r="3" fill="#00f5ff" class="pulse"/>
    <text x="117" y="16" class="tag-text" fill="#00f5ff">KUBERNETES</text>

    <!-- CUDA -->
    <rect x="220" y="0" width="65" height="24" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="232" cy="12" r="3" fill="#00f5ff" class="pulse"/>
    <text x="242" y="16" class="tag-text" fill="#00f5ff">CUDA</text>

    <!-- AWS -->
    <rect x="295" y="0" width="65" height="24" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="307" cy="12" r="3" fill="#00f5ff" class="pulse"/>
    <text x="317" y="16" class="tag-text" fill="#00f5ff">AWS</text>

    <!-- OpenMP -->
    <rect x="370" y="0" width="85" height="24" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="382" cy="12" r="3" fill="#00f5ff" class="pulse"/>
    <text x="392" y="16" class="tag-text" fill="#00f5ff">OPENMP</text>
    
    <!-- Arduino -->
    <rect x="465" y="0" width="90" height="24" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1" rx="2"/>
    <circle cx="477" cy="12" r="3" fill="#00f5ff" class="pulse"/>
    <text x="487" y="16" class="tag-text" fill="#00f5ff">ARDUINO</text>
  </g>

  <line x1="30" y1="575" x2="830" y2="575" stroke="#00ff41" stroke-width="1" opacity="0.15"/>

  <!-- ==================== FOOTER ==================== -->
  <text x="40" y="605" class="status">[ STATUS: ONLINE ]</text>
  <text x="200" y="605" class="status">[ MODE: ENGINEERING ]</text>
  <text x="375" y="605" class="status">[ PROXY: ACTIVE ]</text>
  <text x="530" y="605" class="status">[ THREAT LEVEL: HIGH ]</text>

  <!-- Quote -->
  <line x1="40" y1="615" x2="40" y2="635" stroke="#00ff41" stroke-width="2" filter="url(#glow-sm)"/>
  <text x="55" y="625" class="dim" font-style="italic">"Think like an attacker. Build like a defender."</text>
  <text x="55" y="640" class="status">— Gaurav Kumar</text>
</svg>
