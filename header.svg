<svg width="860" height="820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Orbitron:wght@700;900');

      .bg { fill: #050e06; }
      .grid { fill: url(#gridPattern); opacity: 0.4; }
      .window-border-bg { fill: #00ff41; opacity: 0.01; }
      .window-border-line { fill: none; stroke: #00ff41; stroke-width: 1; opacity: 0.2; }
      
      /* Web aesthetics */
      .main-structure-border { fill: none; stroke: #00ff41; stroke-width: 1; opacity: 0.12; stroke-dasharray: 10 25; }
      .spider-web-line { fill: none; stroke: #00ff41; stroke-width: 0.75; opacity: 0.08; }
      .crumbled-cobweb { fill: none; stroke: #00ff41; stroke-width: 0.5; opacity: 0.15; }
      .crumbled-thick { fill: none; stroke: #00ff41; stroke-width: 1.2; opacity: 0.25; }
      
      /* Realistic Spider styling */
      .spider-body { fill: #081409; stroke: #00ff41; stroke-width: 1; }
      .spider-marking { fill: #00ff41; opacity: 0.7; }
      .spider-leg { fill: none; stroke: #00ff41; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .spider-silk { fill: none; stroke: #00ff41; stroke-width: 0.75; opacity: 0.6; }

      .title {
        font-family: 'Orbitron', 'Courier New', monospace;
        font-size: 38px;
        font-weight: 900;
        fill: #00ff41;
        letter-spacing: 6px;
      }
      .sub {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #00cc33;
        letter-spacing: 3px;
      }
      .prompt-cyan {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 15px;
        fill: #00f5ff;
        font-weight: bold;
      }
      .prompt {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 15px;
        fill: #00ff41;
      }
      .dim {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #00aa33;
        letter-spacing: 0.5px;
      }
      .label {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 12px;
        fill: #00aa22;
        letter-spacing: 2px;
      }
      .status {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #00771a;
        letter-spacing: 1.5px;
      }
      .tag-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: bold;
      }
      .cursor-rect {
        fill: #00ff41;
        animation: blink 1s step-end infinite;
      }
      .glitch {
        animation: glitch 5s infinite;
      }
      .scan-line {
        animation: scan 3s linear infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glitch {
        0%, 88%, 100% { transform: none; }
        90% { transform: translateX(-2px); filter: drop-shadow(3px 0 #ff003c); }
        91% { transform: translateX(2px); filter: drop-shadow(-3px 0 #00f5ff); }
        92% { transform: none; }
      }
      @keyframes scan {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(920px); }
      }
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff41" stroke-width="0.75" opacity="0.12"/>
    </pattern>
    
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="860" height="820" class="bg"/>
  
